# =============================================================================
# build-installers.yml - build GAMGUI for Windows, macOS and Linux and attach
# both a proper INSTALLER and a portable archive for each OS to a release.
#
# Per OS this produces:
#   Windows: GAMGUI-<tag>-Setup.exe   (Inno Setup installer; registers an
#            Add/Remove Programs entry + version under HKLM) and
#            GAMGUI-<tag>-Windows.zip (portable; also what the auto-updater uses)
#   macOS:   GAMGUI-<tag>.dmg         (drag GAMGUI.app to Applications) and
#            GAMGUI-<tag>-macOS.zip   (portable)
#   Linux:   gamgui_<tag>_amd64.deb + gamgui-<tag>-1.x86_64.rpm (register with
#            dpkg/rpm) and GAMGUI-<tag>-Linux.tar.gz (portable)
#
# HOW TO USE: create the release for the tag first, then Actions tab ->
# "Build installers" -> Run workflow -> enter the tag (e.g. 2.9). See
# docs/RELEASING.md.
# =============================================================================
name: Build installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the installers to (e.g. 2.9)"
        required: true

permissions:
  contents: write            # required to upload assets onto the release

jobs:
  build:
    strategy:
      fail-fast: false       # one OS failing must not cancel the others
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tkinter, Xvfb, and packaging tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ruby ruby-dev rpm build-essential
          sudo gem install --no-document fpm

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # ---- Build the app --------------------------------------------------
      - name: Build app (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python extract_tcl.py
          python -m PyInstaller --onedir --windowed --noconfirm --name GAMGUI ^
            --add-data "build_res/_tcl_data;_tcl_data" ^
            --add-data "build_res/_tk_data;_tk_data" GAMGUI.py
          copy /Y updategamgui.ps1 dist\GAMGUI\updategamgui.ps1
          copy /Y HOW-TO-GUIDE.txt dist\GAMGUI\HOW-TO-GUIDE.txt
          copy /Y README.txt dist\GAMGUI\README.txt

      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: |
          python extract_tcl.py
          python -m PyInstaller --onedir --windowed --noconfirm --name GAMGUI \
            --add-data "build_res/_tcl_data:_tcl_data" \
            --add-data "build_res/_tk_data:_tk_data" GAMGUI.py
          cp updategamgui.ps1 dist/GAMGUI/updategamgui.ps1 || true
          cp HOW-TO-GUIDE.txt dist/GAMGUI/HOW-TO-GUIDE.txt || true
          cp README.txt dist/GAMGUI/README.txt || true

      - name: Build app (Linux, Xvfb gives the Tcl-extract a display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python extract_tcl.py
          python -m PyInstaller --onedir --windowed --noconfirm --name GAMGUI \
            --add-data "build_res/_tcl_data:_tcl_data" \
            --add-data "build_res/_tk_data:_tk_data" GAMGUI.py
          cp updategamgui.ps1 dist/GAMGUI/updategamgui.ps1 || true
          cp HOW-TO-GUIDE.txt dist/GAMGUI/HOW-TO-GUIDE.txt || true
          cp README.txt dist/GAMGUI/README.txt || true

      # ---- Portable archives ----------------------------------------------
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GAMGUI -DestinationPath "GAMGUI-${{ github.event.inputs.tag }}-Windows.zip"

      - name: Portable zip (macOS, includes GAMGUI.app)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry "../GAMGUI-${{ github.event.inputs.tag }}-macOS.zip" . && cd ..

      - name: Portable tar.gz (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "GAMGUI-${{ github.event.inputs.tag }}-Linux.tar.gz" -C dist GAMGUI

      # ---- Installers -----------------------------------------------------
      - name: Installer - Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ github.event.inputs.tag }}" "installer\gamgui.iss"

      - name: Installer - DMG (macOS)
        if: runner.os == 'macOS'
        run: bash installer/build-macos-dmg.sh "${{ github.event.inputs.tag }}"

      - name: Installers - deb + rpm (Linux)
        if: runner.os == 'Linux'
        run: bash installer/build-linux-packages.sh "${{ github.event.inputs.tag }}"

      # ---- Attach everything to the release -------------------------------
      - name: Attach archives + installer (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            GAMGUI-${{ github.event.inputs.tag }}-Windows.zip
            GAMGUI-${{ github.event.inputs.tag }}-Setup.exe

      - name: Attach archives + installer (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            GAMGUI-${{ github.event.inputs.tag }}-macOS.zip
            GAMGUI-${{ github.event.inputs.tag }}.dmg

      - name: Attach archives + installers (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            GAMGUI-${{ github.event.inputs.tag }}-Linux.tar.gz
            gamgui_${{ github.event.inputs.tag }}_amd64.deb
            gamgui-${{ github.event.inputs.tag }}-1.x86_64.rpm
