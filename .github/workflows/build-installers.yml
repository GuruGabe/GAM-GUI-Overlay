# =============================================================================
# build-installers.yml - build GAMGUI for Windows, macOS and Linux and attach
# the archives to a GitHub release (the way GAM7 ships a per-OS download).
#
# HOW TO USE: publish (or draft) the release for a version tag first, then go to
# the repo's Actions tab, pick "Build installers", click "Run workflow", and
# enter the same tag (e.g. 2.9). Each OS builds on its own runner and uploads
# its archive to that release. See docs/RELEASING.md for the full flow.
#
# It is a manual (workflow_dispatch) trigger on purpose so it never fires by
# surprise. The build steps mirror the working Build-EXE.bat (Windows) and
# build-app.sh (macOS/Linux); the Linux job runs the Tcl-extract step under
# Xvfb because extract_tcl.py briefly opens a Tk interpreter, which needs a
# display even on a build server.
# =============================================================================
name: Build installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the archives to (e.g. 2.9)"
        required: true

permissions:
  contents: write            # required to upload assets onto the release

jobs:
  build:
    strategy:
      fail-fast: false       # one OS failing must not cancel the others
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tkinter and Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # ---- Build: Windows -------------------------------------------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python extract_tcl.py
          python -m PyInstaller --onedir --windowed --noconfirm --name GAMGUI ^
            --add-data "build_res/_tcl_data;_tcl_data" ^
            --add-data "build_res/_tk_data;_tk_data" GAMGUI.py
          copy /Y updategamgui.ps1 dist\GAMGUI\updategamgui.ps1

      # ---- Build: macOS ---------------------------------------------------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python extract_tcl.py
          python -m PyInstaller --onedir --windowed --noconfirm --name GAMGUI \
            --add-data "build_res/_tcl_data:_tcl_data" \
            --add-data "build_res/_tk_data:_tk_data" GAMGUI.py
          cp updategamgui.ps1 dist/GAMGUI/updategamgui.ps1 || true

      # ---- Build: Linux (Xvfb gives the Tcl-extract a virtual display) ----
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python extract_tcl.py
          python -m PyInstaller --onedir --windowed --noconfirm --name GAMGUI \
            --add-data "build_res/_tcl_data:_tcl_data" \
            --add-data "build_res/_tk_data:_tk_data" GAMGUI.py
          cp updategamgui.ps1 dist/GAMGUI/updategamgui.ps1 || true

      # ---- Package --------------------------------------------------------
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GAMGUI -DestinationPath "GAMGUI-${{ github.event.inputs.tag }}-Windows.zip"

      - name: Package (macOS zip, includes GAMGUI.app)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry "../GAMGUI-${{ github.event.inputs.tag }}-macOS.zip" . && cd ..

      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        run: tar -czf "GAMGUI-${{ github.event.inputs.tag }}-Linux.tar.gz" -C dist GAMGUI

      # ---- Attach to the release ------------------------------------------
      - name: Attach archive to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: GAMGUI-${{ github.event.inputs.tag }}-*
